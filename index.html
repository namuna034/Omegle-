<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmegleWeb - Secure Authentication</title>
    <!-- Tailwind CSS for Modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-modal {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">

    <!-- 🔒 Mandatory Authentication Overlay Modal -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center glass-modal hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 max-w-md w-full shadow-2xl relative">
            
            <!-- App Branding -->
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">OmegleWeb</h1>
                <p id="modalSubtitle" class="text-gray-400 text-sm mt-1">Chat securely with strangers worldwide</p>
            </div>

            <!-- Error / Success Feedback Box -->
            <div id="errorBox" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-xl text-center"></div>

            <!-- Email / Password Form -->
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200 text-sm">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-gray-800"></div>
                <span class="px-3 text-xs text-gray-500 uppercase">Or continue with</span>
                <div class="flex-grow border-t border-gray-800"></div>
            </div>

            <!-- Google Sign-In Button -->
            <button id="googleBtn" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-100 text-gray-900 font-semibold py-3 rounded-xl shadow transition duration-200 text-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>

            <!-- Toggle Mode (Sign In / Sign Up) -->
            <div class="text-center mt-6">
                <button id="toggleModeBtn" class="text-xs text-blue-400 hover:underline">
                    Don't have an account? Sign Up
                </button>
            </div>
        </div>
    </div>

    <!-- 🌐 Main Protected Website Content -->
    <div id="mainAppContent" class="flex-1 flex flex-col hidden">
        <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-blue-400">OmegleWeb</h2>
            <div class="flex items-center gap-4">
                <span id="userEmailDisplay" class="text-sm text-gray-300"></span>
                <button id="logoutBtn" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white text-xs px-4 py-2 rounded-lg transition">
                    Logout
                </button>
            </div>
        </header>

        <main class="flex-1 flex items-center justify-center p-6 text-center">
            <div class="max-w-xl">
                <h3 class="text-3xl font-bold mb-3">Welcome to OmegleWeb Live!</h3>
                <p class="text-gray-400 text-sm mb-6">You are securely authenticated via Firebase backend. Start exploring or connecting with video chats now.</p>
                <div class="p-6 bg-gray-900 border border-gray-800 rounded-2xl shadow-inner">
                    <p class="text-xs text-green-400 font-mono">🟢 Secure Database Connected & Active</p>
                </div>
            </div>
        </main>
    </div>

    <!-- ⚙️ Firebase SDK and Logic Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your real Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyC3ELcxTTj9jKdXVXFHnl8Urde67IZKVaQ",
          authDomain: "omegleweb-af8bf.firebaseapp.com",
          projectId: "omegleweb-af8bf",
          storageBucket: "omegleweb-af8bf.firebasestorage.app",
          messagingSenderId: "60151811841",
          appId: "1:60151811841:web:baac563b5b60cf89dfd500",
          measurementId: "G-TQBKS8115Z"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // UI Elements
        const authModal = document.getElementById('authModal');
        const mainAppContent = document.getElementById('mainAppContent');
        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const googleBtn = document.getElementById('googleBtn');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const errorBox = document.getElementById('errorBox');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const logoutBtn = document.getElementById('logoutBtn');

        let isSignUp = false;

        // Toggle between Sign In and Sign Up modes
        toggleModeBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                submitBtn.textContent = "Create Account";
                modalSubtitle.textContent = "Register a new account to join OmegleWeb";
                toggleModeBtn.textContent = "Already have an account? Sign In";
            } else {
                submitBtn.textContent = "Sign In";
                modalSubtitle.textContent = "Chat securely with strangers worldwide";
                toggleModeBtn.textContent = "Don't have an account? Sign Up";
            }
            errorBox.classList.add('hidden');
        });

        // Handle Email/Password form submission
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('hidden');
            }
        });

        // Handle Google Sign-In popup
        googleBtn.addEventListener('click', async () => {
            errorBox.classList.add('hidden');
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('hidden');
            }
        });

        // Handle Logout
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });

        // Monitor Auth State (Protects the site permanently)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in -> Hide modal, show main app content
                authModal.classList.add('hidden');
                mainAppContent.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
            } else {
                // User is NOT signed in -> Show mandatory login modal, hide main content
                authModal.classList.remove('hidden');
                mainAppContent.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
